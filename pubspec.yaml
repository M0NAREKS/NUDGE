name: nudge
description: "AI-powered fitness & nutrition coach"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.5.4
  http: ^1.2.2

  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  firebase_analytics: ^12.2.0
  cloud_firestore: ^6.1.3
  firebase_messaging: ^16.1.2
  firebase_storage: ^13.1.0

  flutter_local_notifications: ^21.0.0
  google_sign_in: ^7.2.0

  huawei_analytics: ^6.12.0+301
  huawei_push: ^6.14.0+300

  intl: ^0.20.2
  url_launcher: ^6.3.1
  youtube_player_iframe: ^5.2.1
  timezone: ^0.11.0
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - web/icons/Icon-512.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "web/icons/Icon-512.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "web/icons/Icon-512.png"
